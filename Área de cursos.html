:root{
  --red:#e63946;
  --bg:#080808;
  --sidebar:#101010;
  --card:#151515;

  --border:#292929;
  --text:#ffffff;
  --muted:#929292;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{

  background:var(--bg);
  color:var(--text);
}

button{
  font:inherit;
}

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:290px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  position:fixed;
  left:0;
  top:0;
  height:100vh;
  padding:22px;
  overflow-y:auto;
  z-index:10;
}

.logo{
  font-size:27px;
  font-weight:900;
  margin-bottom:30px;
}

.logo span{
  color:var(--red);
}

.student-box{

  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
  margin-bottom:20px;
}

.student-box small{
  display:block;
  color:var(--muted);
  margin-top:6px;
}
