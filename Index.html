 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BateriaPro | Área do Aluno</title>

<style>
:root{
  --red:#e63946;
  --dark:#080808;
  --side:#101010;
  --card:#171717;
  --border:#303030;
  --text:#ffffff;
  --muted:#aaaaaa;
  --green:#22c55e;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--dark);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font-family:inherit;
}

/* MENU */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:290px;
  height:100vh;
  overflow-y:auto;
  background:var(--side);
  border-right:1px solid var(--border);
  padding:20px;
}

.logo{
  font-size:30px;
  font-weight:900;
  margin-bottom:20px;
}

.logo span{
  color:var(--red);
}

.course-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
  margin-bottom:20px;
}

.course-box p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:8px;
}

.progress-text strong{
  color:var(--red);
}

.progress{
  height:10px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

#progressFill{
  height:100%;
  width:0%;
  background:var(--red);
  transition:0.3s;
}

.menu-title{
  color:#777;
  font-size:11px;
  letter-spacing:1px;
  margin:15px 0 10px;
}

.module-button{
  width:100%;
  text-align:left;
  background:#1b1b1b;
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
}

.module-button.active{
  border-color:var(--red);
  background:#281315;
}

.module-button small{
  display:block;
  color:#999;
  margin-top:4px;
}

/* CONTEÚDO */

.main{
  margin-left:290px;
  padding:30px;
  max-width:1400px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.top small{
  color:var(--red);
  font-weight:bold;
}

.top h1{
  margin:5px 0;
}

.counter{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  color:#bbb;
}

.grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.banner{
  padding:30px;
  background:linear-gradient(135deg,#381417,#171717);
}

.drum{
  font-size:48px;
}

.tag{
  color:#ff7780;
  font-weight:bold;
  font-size:12px;
  margin-top:12px;
}

.banner h2{
  font-size:30px;
  margin:8px 0;
}

.banner p{
  color:#bbb;
  line-height:1.6;
}

.content{
  padding:28px;
}

.section{
  margin-bottom:25px;
}

.section h3{
  margin-bottom:10px;
}

.section p,
.section li{
  color:#bbb;
  line-height:1.7;
}

.section ul{
  padding-left:22px;
}

.exercise{
  background:#211012;
  border:1px solid #51252a;
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
}

.tip{
  background:#1c1c1c;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.btn{
  border:0;
  padding:13px 18px;
  border-radius:10px;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:var(--red);
}

.secondary{
  background:#292929;
}

.side-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px;
  margin-bottom:18px;
}

.stat{
  background:#202020;
  border:1px solid var(--border);
  border-radius:10px;
  padding:15px;
  margin-top:10px;
}

.number{
  font-size:28px;
  font-weight:bold;
  color:var(--red);
}

.stat p{
  color:#999;
  margin:4px 0 0;
  font-size:13px;
}

.lesson-button{
  width:100%;
  background:#202020;
  color:white;
  border:1px solid var(--border);
  padding:11px;
  border-radius:9px;
  margin-top:7px;
  text-align:left;
  cursor:pointer;
}

.lesson-button.active{
  border-color:var(--red);
  background:#281315;
}

.lesson-button.done{
  border-color:var(--green);
}

.lesson-button small{
  display:block;
  color:#999;
  margin-top:3px;
}

@media(max-width:950px){

  .sidebar{
    position:relative;
    width:100%;
    height:auto;
  }

  .main{
    margin-left:0;
    padding:18px;
  }

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .top{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

  .banner,
  .content{
    padding:20px;
  }

}
</style>
</head>

<div class="side-card">

</div>

</aside>

</div>

},

"2-0":{
  content:"Coordenação é a capacidade de movimentar partes diferentes do corpo de forma independente e simultânea. Na bateria, você usa as duas mãos e os dois pés ao mesmo tempo, cada um fazendo coisas diferentes. Para desenvolver coordenação, é preciso isolar cada membro e depois combiná-los gradualmente. O cérebro precisa de repetição para automatizar esses movimentos.",
  points:["Comece isolando cada membro","Combine dois membros por vez","A automatização vem com repetição","Lento e correto é melhor que rápido e errado"],
  exercise:"Pratique o exercício RLRL (direita, esquerda, direita, esquerda) em uma superfície plana por 3 minutos. Sem baqueta, apenas os dedos batendo na mesa.",
  tip:"Não force o cérebro. Se travar na combinação de membros, pare, respire e recomece mais devagar. A pressão atrapalha a aprendizagem motora."
},

"2-1":{
  content:"O bumbo é controlado pelo pedal com o pé direito (para destros). O movimento correto envolve o calcanhar levemente levantado e a ponta do pé pressionando o pedal. Existem duas técnicas: heel-down (calcanhar no chão, movimento do tornozelo) e heel-up (calcanhar levantado, movimento da perna inteira). Heel-up produz mais volume e é preferida para rock.",
  points:["Heel-down: calcanhar no chão, mais controle","Heel-up: calcanhar levantado, mais potência","Mantenha o pé relaxado sobre o pedal","O retorno do pedal é automático — não force"],
  exercise:"Pratique apenas o bumbo por 5 minutos: 4 batidas por compasso com metrônomo em 60 BPM. Observe se o som está uniforme em todas as batidas.",
  tip:"O bumbo deve soar igual em todas as batidas. Se algumas ficam mais fracas, é sinal de que você está perdendo a posição do pé."
},

"2-2":{
  content:"Combinar mãos e pé é o grande salto da coordenação. O exercício fundamental é: mão direita no chimbal em todos os tempos + pé direito no bumbo nos tempos 1 e 3. Quando isso estiver automático, adicione a mão esquerda na caixa nos tempos 2 e 4. Esse é o ritmo básico completo, mas agora você entende mecanicamente o que está fazendo.",
  points:["Comece com MÃO DIREITA + PÉ DIREITO","Depois adicione MÃO ESQUERDA","Nunca adicione um membro antes do anterior estar automático","Se um membro falhar, volte para menos membros"],
  exercise:"Por 5 minutos: mão direita bate chimbal em todos os tempos, pé direito bate bumbo no 1 e 3. Sem caixa ainda. Quando isso travar, adicione a caixa no 2 e 4.",
  tip:"Pense no chimbal e no bumbo como um relógio: constantes e automáticos. A caixa é o que muda — foque sua atenção nela."
},

"2-3":{
  content:"Independência é quando você consegue tocar padrões diferentes com cada membro sem que um interfira no outro. Um exercício clássico: mão direita toca colcheias no chimbal, mão esquerda toca na caixa em diferentes posições, enquanto o pé mantém o bumbo constante. A independência real leva meses ou anos para desenvolver — seja paciente.",
  points:["Independência é um processo gradual","Pratique exercícios de independência diariamente","Comece com dois membros, depois três, depois quatro","Use partituras simples de independência para guiar"],
  exercise:"Toque a caixa com a mão esquerda nas posições: tempo 1, depois tempo 2, depois tempo 3, depois tempo 4, enquanto a mão direita mantém o chimbal constante. Faça um por vez.",
  tip:"A independência não é 'tentar fazer muitas coisas ao mesmo tempo'. É treinar cada combinação até que ela seja automática."
},

"2-4":{
  content:"Este exercício reúne tudo do módulo de coordenação. Execute o ritmo completo (chimbal, caixa no 2 e 4, bumbo no 1 e 3) durante 10 minutos com metrônomo em 70 BPM. A cada 2 minutos, adicione uma pequena variação. Observe se consegue manter a estabilidade ao variar. Se perder o pulso, simplifique e reconstrua.",
  points:["10 minutos de ritmo contínuo testa sua resistência","Variações devem ser planejadas, não improvisadas","Se perder, simplifique — não force","Grave a sessão e analise depois"],
  exercise:"Metrônomo em 70 BPM. Toque o ritmo completo por 2 minutos. Depois adicione bumbo extra no 'e' do tempo 4 por mais 2 minutos. Depois abra o chimbal no tempo 2. Repita ciclo.",
  tip:"Resistência rítmica — conseguir tocar estável por longos períodos — é tão importante quanto velocidade. Treine duração, não só velocidade."
},

"3-0":{
  content:"O rock é caracterizado pelo backbeat forte: caixa nos tempos 2 e 4, bumbo nos tempos 1 e 3 e chimbal em colcheias. É o ritmo mais direto e poderoso do pop ocidental. Bateristas como John Bonham (Led Zeppelin) e Dave Grohl (Foo Fighters) são ícones desse estilo. O segredo do rock é a consistência e a garra — cada batida deve soar com convicção.",
  points:["Backbeat forte: caixa no 2 e 4","Bumbo drive: 1 e 3","Chimbal constante em colcheias","Toque com garra e convicção"],
  exercise:"Toque o ritmo de rock básico por 5 minutos em 90 BPM. Concentre-se em fazer a caixa soar forte e precisa. Esse é o coração do rock.",
  tip:"No rock, a caixa deve soar como um tiro. Se ela está fraca, aumente a altura do golpe e bata no centro da pele."
},

"3-1":{
  content:"Variações de rock incluem: bumbo duplo (1, 3 e um extra), half-time feel (caixa só no tempo 3), ritmo de balada (mais lento, colcheias mais espaçadas) e abertura do chimbal. Cada variação cria uma sensação diferente — o half-time, por exemplo, faz a música parecer mais lenta mesmo sem mudar o BPM. Bateristas usam essas variações para marcar diferentes seções da música.",
  points:["Half-time: caixa apenas no tempo 3","Double time: dobrar a velocidade do chimbal","Balada: colcheias espaçadas e suaves","Abertura do chimbal cria tensão e abertura"],
  exercise:"Toque o ritmo básico por 4 compassos, depois mude para half-time por 4 compassos, depois volte. Repita o ciclo por 10 minutos. Essa é a estrutura de muitas músicas de rock.",
  tip:"O half-time é muito usado em bridges e partes mais lentas de músicas. Reconhecê-lo vai ajudá-lo a entender a estrutura das músicas que você ouve."
},

"3-2":{
  content:"O ritmo pop é baseado em um padrão limpo e consistente que serve a qualquer estilo de música comercial. Geralmente usa chimbal em todas as colcheias, caixa no 2 e 4 e bumbo variando conforme a música. No pop, o baterista serve à canção — discreto, sólido, sem chamar atenção. Bateristas como Matt Chamberlain e Steve Jordan são mestres do pop.",
  points:["Pop: sirva à música, não ao ego","Chimbal limpo e consistente","Bumbo segue a melodia vocal ou o baixo","Menos é mais no pop"],
  exercise:"Ouça uma música pop e identifique os padrões do baterista. Tente replicar apenas o chimbal e a caixa primeiro, depois adicione o bumbo conforme você escuta.",
  tip:"No pop, um erro de tempo é muito mais perceptível do que em gêneros mais pesados. A precisão é mais valorizada que a criatividade aqui."
},

"3-3":{
  content:"O samba brasileiro tem uma estrutura rítmica complexa e única. O padrão tradicional usa o surdo (bumbo) em tempos diferentes dos ritmos ocidentais, e a caixa faz padrões com mais liberdade. O chimbal no samba frequentemente fica em colcheias ou semicolcheias. O samba tem swing — uma pequena irregularidade intencional que cria a sensação de balanço característica.",
  points:["Samba tem swing — não é rígido como o metrônomo","Surdo em posições não convencionais","Caixa com mais liberdade rítmica","O groove vem da interação entre os elementos"],
  exercise:"Toque colcheias no chimbal com o pé no bumbo apenas no tempo 3. Adicione a caixa no tempo 2 com um ghost note antes. Repita lentamente até sentir o balanço.",
  tip:"Ouça muito samba antes de tentar tocar. O groove do samba precisa entrar nos seus ouvidos antes de sair pelas suas mãos."
},

"3-4":{
  content:"O funk é o ritmo do groove. James Brown revolucionou a música ao colocar o acento no tempo 1 (o 'ONE' famoso). O funk usa o bumbo de forma muito sincopada — em lugares inesperados do compasso — e a caixa com ghost notes (notas suaves entre os acentos). O chimbal pode ficar semi-aberto para criar um som mais aberto e orgânico.",
  points:["Funk acentua o tempo 1 com força","Sincopas no bumbo: notas em lugares inesperados","Ghost notes na caixa: notas muito suaves","Chimbal semi-aberto cria textura"],
  exercise:"Toque bumbo no tempo 1 e no 'e' do tempo 2. Chimbal em todas as colcheias. Caixa no 3. Adicione ghost notes suaves antes da caixa. Repita até sentir o groove.",
  tip:"No funk, o que você NÃO toca é tão importante quanto o que você toca. Espaço é groove."
},

"3-5":{
  content:"O reggae é definido pelos espaços. O padrão clássico tem a caixa no tempo 3 (não no 2 e 4 como no rock), criando uma sensação de leveza e descanso. O bumbo é minimalista. O chimbal fica constante mas suave. A sensação geral é de leveza e relaxamento. Bateristas como Sly Dunbar criaram o estilo de drumming que definiu o reggae jamaicano.",
  points:["Caixa no tempo 3: sensação de leveza","Bumbo minimalista","Os espaços são parte do ritmo","Leveza e relaxamento são a essência do reggae"],
  exercise:"Toque apenas o chimbal em colcheias por 1 minuto. Depois adicione a caixa APENAS no tempo 3. Depois adicione o bumbo no tempo 1. Sinta como o ritmo 'respira'.",
  tip:"Toque reggae com menos força do que você acha necessário. A suavidade e os espaços são o que fazem o reggae soar como reggae."
},

"4-0":{
  content:"Rudimentos são exercícios fundamentais de técnica de baqueta, como as escalas são para pianistas. Os mais importantes são: single stroke roll (RLRL), double stroke roll (RRLL), paradiddle (RLRR LRLL) e flam. A Percussive Arts Society cataloga 40 rudimentos essenciais. Dominar os rudimentos transforma sua técnica e versatilidade como baterista.",
  points:["Single stroke: RLRL — o mais fundamental","Double stroke: RRLL — aumenta velocidade","Paradiddle: RLRR LRLL — cria independência","Flam: duas baquetas quase simultâneas"],
  exercise:"Pratique o single stroke (RLRL) em um pad durante 5 minutos: 2 minutos lento (60 BPM), 2 minutos médio (80 BPM), 1 minuto rápido (100 BPM). Mantenha o som uniforme.",
  tip:"Pratique rudimentos em pads, não apenas na bateria. Pads eliminam o elemento sonoro e forçam você a focar na técnica pura."
},

"4-1":{
  content:"O single stroke roll é o rudimento mais básico e o mais importante. Consiste em alternar as baquetas: direita, esquerda, direita, esquerda (RLRL) continuamente. O desafio é manter as notas com volume igual nas duas mãos e o espaçamento uniforme. A mão não-dominante costuma ser mais fraca — é preciso trabalhar especificamente nela.",
  points:["Alterne: D E D E D E sem parar","Volume igual nas duas mãos","Espaçamento uniforme entre os golpes","Fortaleça a mão não-dominante separadamente"],
  exercise:"5 minutos de single stroke: 1 min cada mão separado (só direita, só esquerda), depois 3 minutos alternando. Com metrônomo, comece em 60 BPM.",
  tip:"Grave o som dos seus rudimentos. Você ouvirá claramente se uma mão está mais alta que a outra — é difícil perceber enquanto toca."
},

"4-2":{
  content:"O double stroke consiste em dois golpes por mão: RRLL RRLL. O segundo golpe de cada mão usa o ricochete natural da baqueta — você não bate duas vezes, você controla o quique. Esse controle é o segredo do double stroke. É muito usado em solos e em ritmos rápidos onde o single stroke tornaria os pulsos cansativos demais.",
  points:["Dois golpes por mão: RRLL","O segundo golpe usa o ricochete da baqueta","Controle do quique, não força bruta","Essencial para velocidade sustentada"],
  exercise:"Devagar (40 BPM), toque RRLL com atenção no segundo golpe de cada mão. O quique deve soar tão alto quanto o primeiro golpe. Aumente 5 BPM por sessão.",
  tip:"Se o segundo golpe estiver mais baixo, você está apertando a baqueta. Relaxe a mão e deixe a física trabalhar por você."
},

"4-3":{
  content:"Dinâmica é controlar a intensidade do que você toca. Tocar forte o tempo todo é monótono e cansativo para os ouvintes. Variações de dinâmica criam tensão, emoção e contraste. Os termos musicais são: pp (pianíssimo), p (piano), mp (mezzo-piano), mf (mezzo-forte), f (forte), ff (fortíssimo). Na bateria, dinâmica é controlada pela altura da baqueta e pela velocidade do golpe.",
  points:["Dinâmica cria emoção e contraste","Forte não significa melhor","Aprenda a tocar muito suave — é mais difícil","A altura do golpe controla o volume"],
  exercise:"Toque o ritmo básico por 4 compassos forte, depois 4 compassos suave, depois 4 crescendo (do suave ao forte). Repita o ciclo por 10 minutos.",
  tip:"Ghost notes (notas suavíssimas) são uma das ferramentas mais poderosas do baterista. Pratique tocar o mais suave possível."
},

"4-4":{
  content:"Velocidade é consequência de técnica correta — não de esforço. Bateristas iniciantes tentam tocar rápido antes de ter a técnica adequada e criam tensão muscular que limita sua velocidade. O caminho certo é: técnica perfeita devagar → aumento gradual de BPM → velocidade natural surge. O método de prática com metrônomo (aumentar 2 BPM por sessão) é comprovadamente eficaz.",
  points:["Velocidade vem de técnica, não de força","Tensão muscular limita velocidade","Aumente 2-5 BPM por sessão","Nunca force além do confortável"],
  exercise:"Escolha qualquer rudimento. Metrônomo na velocidade máxima confortável. Toque por 2 minutos. Aumente 3 BPM. Repita. Se errar, volte 5 BPM.",
  tip:"A 'barreira da velocidade' que todo baterista encontra se quebra com paciência, não com força. Quanto mais relaxado, mais rápido você vai ficar."
},

"4-5":{
  content:"Agora é hora de avaliar sua precisão de tempo com o metrônomo. Existem técnicas avançadas: tocar nas subdivisões (entre os cliques), tocar o metrônomo em apenas 2 e 4 enquanto você mantém o 1, 2, 3 e 4 por conta própria, e eliminar o clique gradualmente. Essas práticas desenvolvem o relógio interno — a capacidade de manter o tempo sem referência externa.",
  points:["Toque nas subdivisões (entre os cliques)","Metrônomo só no 2 e 4: você cria o 1 e 3","Eliminar o clique testa seu relógio interno","Grave sem metrônomo e depois compare com ele"],
  exercise:"Ligue o metrônomo em 80 BPM. Tocar com o clique representando o tempo 2 e 4 (backbeat). Você deve criar os tempos 1 e 3 internamente. 5 minutos de prática.",
  tip:"Este é um exercício avançado que bateristas profissionais usam. Se parecer difícil, é porque é — e é exatamente por isso que vai transformar sua percepção de tempo."
},

"5-0":{
  content:"Tocar com uma música gravada é completamente diferente de tocar com metrônomo. A música tem dinâmicas, emoções e variações que o metrônomo não tem. Você precisa 'escutar' enquanto toca — sentir a melodia, o baixo e as letras — e o ritmo da bateria deve servir à canção. Comece com músicas que você conhece bem, em um BPM confortável.",
  points:["Escute enquanto toca — não apenas toque","O ritmo serve à canção, não o contrário","Comece com músicas que você conhece de cor","Use fones para ouvir melhor a música enquanto toca"],
  exercise:"Escolha uma música lenta que você ama. Toque apenas o chimbal seguindo o pulso da música por 3 minutos. Depois adicione a caixa e o bumbo gradualmente.",
  tip:"Se você 'empurrar' a música (tocar antes do tempo), relaxe. Se você 'arrastar' (tocar depois), energize-se. A música deve parecer natural, não forçada."
},

"5-1":{
  content:"Uma apresentação exige preparação mental e técnica. Pratique o repertório inteiro em ordem várias vezes antes do dia. Simule a apresentação: toque do começo ao fim sem parar, mesmo se errar. Aprenda a continuar após um erro — parar é pior do que errar. Defina os ritmos, as viradas e as dinâmicas antes do show. Improviso sem base sólida resulta em bagunça.",
  points:["Pratique o repertório inteiro em ordem","Simule a apresentação sem parar","Aprenda a continuar após erros","Defina tudo com antecedência — não improvise o que não treinou"],
  exercise:"Simule uma 'mini apresentação': 3 músicas em sequência sem parar. Grave em vídeo. Assista e anote: onde errou o tempo? Onde poderia melhorar a dinâmica?",
  tip:"O nervosismo faz o tempo acelerar. Pratique conscientemente mais lento do que acha necessário — no show, o tempo natural vai compensar."
},

"5-2":{
  content:"Manter o tempo estável em uma apresentação ao vivo é o maior desafio para bateristas. Fatores que fazem o tempo variar: nervosismo, adrenalina, partes difíceis tecnicamente, e a influência dos outros músicos. Técnicas para manter o tempo: respire regularmente, confie no metrônomo interno, não acelere nas partes fáceis nem desacelere nas difíceis.",
  points:["Nervosismo faz o tempo acelerar — antecipe isso","Respire regularmente enquanto toca","Partes fáceis tendem a acelerar — cuidado","Partes difíceis tendem a arrastar — antecipe"],
  exercise:"Toque 10 minutos seguidos de qualquer ritmo sem metrônomo. Depois ligue o metrônomo e toque mais 2 minutos. Onde você estava? Adiantado ou atrasado?",
  tip:"Use um monitor in-ear com o metrônomo em apresentações ao vivo se possível. Muitos profissionais fazem isso — não é 'trapaça', é profissionalismo."
},

"5-3":{
  content:"Os erros mais comuns de bateristas iniciantes: acelerar nas partes empolgantes, bater muito forte (sem dinâmica), não ouvir os outros músicos, fazer viradas na hora errada, e tensionar o corpo ao tocar. Identificar seus erros específicos é o primeiro passo para corrigi-los. Grave-se regularmente e ouça com um ouvido crítico mas construtivo.",
  points:["Aceleração nas partes empolgantes: erro muito comum","Tocar sempre forte: falta de dinâmica","Não ouvir a banda: foca demais em si mesmo","Viradas na hora errada: falta de planejamento"],
  exercise:"Grave-se tocando por 10 minutos. Assista e faça uma lista de 3 erros específicos que você quer corrigir. Na próxima sessão, foque apenas nesses 3 pontos.",
  tip:"Criticar sua própria execução sem se desanimar é uma habilidade. Seja objetivo como um técnico, não emocional como alguém que está sendo julgado."
},

"5-4":{
  content:"Um plano de evolução organiza seus estudos para que você progrida de forma estruturada. Divida seu tempo de prática em: 20% aquecimento e técnica, 40% repertório atual, 20% material novo, 20% gravação e análise. Defina metas mensais específicas: 'Quero tocar o ritmo X em 120 BPM até o final do mês.' Metas vagas não funcionam.",
  points:["20% aquecimento e rudimentos","40% repertório (o que você já sabe)","20% material novo (o que está aprendendo)","20% gravação e análise honesta"],
  exercise:"Escreva seu plano de estudos para as próximas 4 semanas. Defina uma meta específica por semana. Cole no espelho ou na parede da bateria.",
  tip:"Revise seu plano de evolução a cada mês. O que estava difícil há um mês e agora é fácil? Essa lista é a prova do seu progresso."
},

"5-5":{
  content:"Você concluiu os módulos fundamentais. Os próximos passos incluem: estudar mais estilos (jazz, metal, bossa nova, blues), aprender leitura de partitura de bateria, estudar com um professor presencial para feedback direto, tocar com outros músicos (jam sessions), e assistir a masterclasses online de bateristas que você admira. A jornada musical nunca termina — cada nível revela um novo horizonte.",
  points:["Explore outros estilos musicais","Aprenda a ler partituras de bateria","Toque com outros músicos sempre que possível","Nunca pare de ser aluno — mesmo os melhores estudam"],
  exercise:"Pesquise um baterista que você admira. Assista a um vídeo de ele tocando e a um de ele ensinando. Escreva: o que ele faz que você quer aprender?",
  tip:"A bateria é um instrumento de serviço. Quanto mais você servir bem à música e aos outros músicos, mais você vai crescer como baterista e como artista."
},

"6-0":{
  content:"A leitura rítmica é a capacidade de interpretar símbolos musicais e transformá-los em som. As figuras musicais representam durações: a semibreve dura 4 tempos, a mínima dura 2 tempos, a semínima dura 1 tempo, a colcheia dura meio tempo e a semicolcheia dura um quarto de tempo. Saber ler ritmos permite aprender músicas mais rapidamente e estudar de livros didáticos.",
  points:["Semibreve: 4 tempos","Mínima: 2 tempos","Semínima: 1 tempo","Colcheia: 1/2 tempo | Semicolcheia: 1/4 de tempo"],
  exercise:"Escreva em papel as figuras musicais do maior para o menor valor. Debaixo de cada uma, escreva quantos tempos dura. Revise até memorizar sem consultar.",
  tip:"Pense nas figuras como frações do compasso: a semibreve é o bolo inteiro, a mínima é metade, a semínima é um quarto, e assim por diante."
},

"6-1":{
  content:"A semínima é a figura mais usada em música popular — ela representa um tempo do compasso 4/4. Quando você conta 1, 2, 3, 4 em um compasso, cada número corresponde a uma semínima. Na notação, a semínima tem cabeça preenchida e haste. Em partituras de bateria, cada instrumento (bumbo, caixa, pratos) fica em uma linha ou espaço diferente.",
  points:["Semínima = 1 tempo no compasso 4/4","Cabeça preenchida + haste na notação","4 semínimas preenchem um compasso 4/4","É a figura de referência para contar tempos"],
  exercise:"Leia em voz alta batendo palmas: 4 semínimas por compasso durante 2 minutos com metrônomo em 70 BPM. Diga o número do tempo enquanto bate a palma.",
  tip:"Quando você conta '1-2-3-4', você já está lendo semínimas. A notação apenas representa visualmente o que você já faz naturalmente."
},

"6-2":{
  content:"A colcheia divide o tempo ao meio — cabe duas colcheias em uma semínima. Contamos as colcheias assim: '1 e 2 e 3 e 4 e'. O 'e' representa a colcheia entre cada tempo. O chimbal em ritmos de rock normalmente toca em colcheias. Na notação, colcheias têm uma bandeirinha na haste (isoladas) ou são ligadas em grupos por uma barra.",
  points:["Colcheia = metade de uma semínima","Contagem: 1 e 2 e 3 e 4 e","Cabe 8 colcheias em um compasso 4/4","Chimbal geralmente em colcheias nos ritmos básicos"],
  exercise:"Com metrônomo em 70 BPM, conte '1 e 2 e 3 e 4 e' em voz alta enquanto bate o chimbal em cada sílaba. O metrônomo bate nos números, você bate também nos 'e'.",
  tip:"A sílaba 'e' é a colcheia entre tempos. Quando estiver fluindo naturalmente, você já está fazendo subdivisão rítmica instintivamente."
},

"6-3":{
  content:"As pausas representam silêncios — momentos em que não se toca. Cada figura tem uma pausa correspondente: pausa de semibreve (4 tempos de silêncio), pausa de mínima (2 tempos), pausa de semínima (1 tempo) e pausa de colcheia (meio tempo). Silêncio é parte da música. Um ritmo com pausas bem colocadas soa mais musical do que notas ininterruptas.",
  points:["Pausa de semibreve: 4 tempos de silêncio","Pausa de semínima: 1 tempo de silêncio","Silêncio é parte ativa do ritmo","Pausas criam tensão, antecipação e groove"],
  exercise:"Toque o seguinte: 3 semínimas no chimbal, depois 1 pausa (silêncio no 4º tempo). Repita por 5 minutos. Sinta como a pausa cria expectativa.",
  tip:"Os melhores bateristas sabem quando NÃO tocar. A próxima nota após um silêncio sempre soa mais impactante."
},

"6-4":{
  content:"Agora vamos combinar semínimas, colcheias e pausas para ler ritmos simples. A leitura musical é como aprender um idioma: primeiro você decifra letra por letra, depois palavra por palavra, depois lê fluentemente. Comece com ritmos escritos com apenas semínimas e pausas, depois adicione colcheias. Fale o ritmo em voz alta antes de tocá-lo — isso organiza o pensamento musical.",
  points:["Fale o ritmo em voz alta antes de tocar","Comece com figuras maiores, adicione menores depois","Um compasso por vez — não apresse","Associe o símbolo ao som que ele representa"],
  exercise:"Escreva em papel: semínima, pausa, colcheia colcheia, pausa. Fale em voz alta: 'um — dois e — quatro'. Depois toque no chimbal exatamente o que falou.",

"7-0":{
  content:"Viradas (fills) são passagens rítmicas usadas para marcar transições na música — de uma seção para outra (verso para refrão, por exemplo). Uma virada ocupa geralmente o último compasso antes da transição. Ela cria expectativa e sinaliza para os outros músicos que uma mudança está chegando. Uma boa virada deve ser intencional, no tempo certo e servir à música.",
  points:["Virada marca transições na música","Geralmente no último compasso antes da mudança","Cria expectativa para o ouvinte","Deve servir à música, não chamar atenção para si"],

},

  points:["4 semínimas na caixa: virada mais simples possível","Descida pelos tons: clássico e eficaz","Precisão é mais importante que complexidade","Domine 3-4 viradas simples antes de criar novas"],

  tip:"Viradas com crash no final (no tempo 1 do compasso seguinte) sempre soam conclusivas e eficazes. É uma fórmula clássica que funciona em qualquer estilo."
},

"7-2":{
  content:"Incluir diferentes tambores nas viradas cria movimento e cor sonora. Você pode subir pelos tons (surdo para caixa), descer (caixa para surdo), ou criar padrões alternados. Cada tambor tem um timbre diferente — caixa é mais agressiva, surdo é mais grave e encorpado, tons médios são mais melódicos. Usar essa variedade conscientemente enriquece suas viradas.",
  points:["Descida (caixa→surdo): sensação de 'resolução'","Subida (surdo→caixa): cria tensão e energia","Alternado: mais complexo, mais interessante","Use o timbre de cada tambor conscientemente"],
  exercise:"Crie 3 viradas de 4 notas usando diferentes tambores. Virada 1: só caixa. Virada 2: caixa e surdo alternados. Virada 3: descida completa. Pratique cada uma por 5 minutos.",
  tip:"Experimente a mesma virada começando em tambores diferentes. Você vai descobrir que o mesmo padrão soa completamente diferente dependendo de onde começa."
},

"7-3":{
  content:"O maior erro nas viradas é perder o tempo. A virada deve terminar no exato momento em que o novo compasso começa — não antes, não depois. Para isso, sempre pense na nota final da virada como o ponto de ancoragem. Muitos bateristas cometem o erro de 'atrasar' a virada porque se concentram demais nos tambores e esquecem de onde estão no tempo.",
  points:["A última nota da virada âncora no tempo 1 seguinte","Pense no destino antes de começar a virada","Pratique com metrônomo sempre","Se perder o tempo, a virada falhou — independente de soar bem"],

},

"7-4":{
  content:"Criar suas próprias viradas é o passo final para tornar seu drumming pessoal e criativo. Comece variando viradas que você já sabe: mude um tambor, adicione uma nota, retire uma nota. Experimente viradas de 2 notas (muito simples e eficazes), de 8 notas (rápidas e dramáticas) e misture tambores com pratos. Anote as viradas que você cria — você vai esquecer se não registrar.",

"8-0":{

"8-2":{

  points:["Ouça a música e mapeie sua estrutura","Identifique: intro, verso, refrão, ponte","Saiba quantos compassos tem cada seção","Planeje as viradas com antecedência"],

  tip:"Contar compassos enquanto toca é fundamental. Se você sabe que o refrão chega no compasso 9, você pode preparar a virada no compasso 8."

"8-3":{

  points:["Ouça bateristas de estilos diferentes","Inverta padrões: coloque cada elemento em lugares novos","Grave suas improvisações sem julgamento","Criatividade é repertório + experimentação"],

  points:["3 músicas completas: rock, pop e estilo brasileiro","Ritmos corretos, viradas planejadas e dinâmica variada","Grave em vídeo para registrar seu progresso","Compare com onde você estava na Aula 1"],
  exercise:"Grave seu projeto final: 3 músicas em sequência, sem parar entre elas. Trate como uma mini apresentação. Assista o vídeo com orgulho — você construiu isso do zero.",
  tip:"Você chegou até aqui. Isso já diz muito sobre sua dedicação. A bateria é uma jornada sem fim — cada nível que você alcança abre um novo horizonte. Continue tocando, continue estudando, continue evoluindo."

};

/* ESTADO */

let currentModule = 0;
let currentLesson = 0;

let completed = [];

try{

const saved = localStorage.getItem("bateriapro_progress");
completed = saved ? JSON.parse(saved) : [];

// Limpar IDs inválidos de versões antigas
const totalModules = course.length;
completed = completed.filter(id => {
  const parts = id.split("-");
  if(parts.length !== 2) return false;
  const m = parseInt(parts[0]);
  const l = parseInt(parts[1]);
  if(isNaN(m) || isNaN(l)) return false;
  if(m >= totalModules) return false;
  if(l >= course[m].lessons.length) return false;
  return true;
});

localStorage.setItem("bateriapro_progress", JSON.stringify(completed));

}catch(error){

completed = [];

}


/* GERAR DADOS DA AULA */

function getLessonData(title,summary,moduleIdx,lessonIdx){

const key = moduleIdx + "-" + lessonIdx;

const data = LESSONS_DATA[key];

return {

title:title,

summary:summary,

content: data ? data.content : "Conteúdo desta aula em breve.",

points: data ? data.points : ["Pratique devagar","Mantenha o pulso","Evite tensão","Repita regularmente"],

exercise: data ? data.exercise : "Reserve alguns minutos para praticar o conteúdo desta aula.",

tip: data ? data.tip : "Não tente aumentar a velocidade rapidamente. Primeiro desenvolva controle."

};

}


/* TOTAL */

function getTotalLessons(){

let total = 0;

course.forEach(module=>{

total += module.lessons.length;

});

return total;

}


function getLessonId(module,lesson){

return module + "-" + lesson;

}


/* MÓDULOS */

function renderModules(){

const container =
document.getElementById("moduleList");

container.innerHTML = "";

course.forEach((module,index)=>{

const button =
document.createElement("button");

button.className =
"module-button " +
(index === currentModule ? "active" : "");

button.innerHTML = `

<strong>
📘 Módulo ${String(index+1).padStart(2,"0")}
</strong>

<small>
${module.name}
</small>

`;

button.onclick = function(){

currentModule = index;

currentLesson = 0;

render();

};

container.appendChild(button);

});

}


/* AULAS */

function renderLessons(){

const container =
document.getElementById("lessonList");

container.innerHTML = "";

const lessons =
course[currentModule].lessons;

lessons.forEach((lesson,index)=>{

const lessonID =
getLessonId(
currentModule,
index
);

const isDone =
completed.includes(lessonID);

const button =
document.createElement("button");

button.className =
"lesson-button " +
(index === currentLesson ? "active " : "") +
(isDone ? "done" : "");

button.innerHTML = `

${isDone ? "✅" : "📖"}

<strong>
${String(index+1).padStart(2,"0")}.
${lesson[0]}
</strong>

<small>
${isDone ? "Concluída" : "Aula escrita"}
</small>

`;

button.onclick = function(){

currentLesson = index;

render();

window.scrollTo({

top:0,
behavior:"smooth"

});

};

container.appendChild(button);

});

}


/* CARREGAR AULA */

function loadLesson(){

const lesson =
course[currentModule]
.lessons[currentLesson];

const data =
getLessonData(
lesson[0],
lesson[1],
currentModule,
currentLesson
);

document
.getElementById("lessonTag")
.textContent =

"MÓDULO " +
String(currentModule+1).padStart(2,"0") +
" • AULA " +
String(currentLesson+1).padStart(2,"0");


document
.getElementById("lessonTitle")
.textContent =
data.title;


document
.getElementById("lessonSummary")
.textContent =
data.summary;


document
.getElementById("lessonContent")
.textContent =
data.content;


document
.getElementById("lessonExercise")
.textContent =
data.exercise;


document
.getElementById("lessonTip")
.textContent =
data.tip;


const points =
document.getElementById("lessonPoints");

points.innerHTML = "";

data.points.forEach(point=>{

const item =
document.createElement("li");

item.textContent = point;

points.appendChild(item);

});

}


/* PROGRESSO */

function updateProgress(){

const total =
getTotalLessons();

const done =
completed.length;

const percent =
Math.round(
(done / total) * 100
);


document
.getElementById("progressPercent")
.textContent =
percent + "%";


document
.getElementById("progressFill")
.style.width =
percent + "%";


document
.getElementById("counter")
.textContent =
done +
" de " +
total +
" aulas concluídas";


document
.getElementById("completedNumber")
.textContent =
done;


document
.getElementById("remainingNumber")
.textContent =
total - done;

}


/* CONCLUIR */

function completeLesson(){

const id =
getLessonId(
currentModule,
currentLesson
);

if(!completed.includes(id)){

completed.push(id);

localStorage.setItem(
"bateriapro_progress",
JSON.stringify(completed)
);

}

const isLastModule = currentModule === course.length - 1;
const isLastLesson = currentLesson === course[currentModule].lessons.length - 1;

if(isLastModule && isLastLesson){
render();
const btn = document.getElementById("btnConcluir");
if(btn){
btn.textContent = "🎉 Curso Concluído!";
btn.style.background = "#22c55e";
btn.onclick = null;
}
return;
}

nextLesson();

}


/* PRÓXIMA */

function nextLesson(){

const lessons =
course[currentModule].lessons;


if(
currentLesson <
lessons.length - 1
){

currentLesson++;

}

else if(
currentModule <
course.length - 1
){

currentModule++;

currentLesson = 0;

}


render();


window.scrollTo({

top:0,
behavior:"smooth"

});

}


/* ANTERIOR */

function previousLesson(){

if(currentLesson > 0){

currentLesson--;

}

else if(currentModule > 0){

currentModule--;

currentLesson =
course[currentModule]
.lessons.length - 1;

}


render();


window.scrollTo({

top:0,
behavior:"smooth"

});

}


/* RENDER */

function render(){

document
.getElementById("moduleTitle")
.textContent =

"Módulo " +
String(currentModule+1).padStart(2,"0") +
" — " +
course[currentModule].name;


document
.getElementById("lessonListTitle")
.textContent =

"📚 " +
course[currentModule].name;


renderModules();

renderLessons();

loadLesson();

updateProgress();

}


/* INICIAR */

render();

</script>
