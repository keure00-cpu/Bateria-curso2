 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BateriaPro | Área do Aluno</title>

<style>
:root{
  --red:#e63946;
  --dark:#080808;
  --side:#101010;
  --card:#171717;
  --border:#303030;
  --text:#ffffff;
  --muted:#aaaaaa;
  --green:#22c55e;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--dark);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font-family:inherit;
}

/* MENU */

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:290px;
  height:100vh;
  overflow-y:auto;
  background:var(--side);
  border-right:1px solid var(--border);
  padding:20px;
}

.logo{
  font-size:30px;
  font-weight:900;
  margin-bottom:20px;
}

.logo span{
  color:var(--red);
}

.course-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
  margin-bottom:20px;
}

.course-box p{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

.progress-text{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:8px;
}

.progress-text strong{
  color:var(--red);
}

.progress{
  height:10px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

#progressFill{
  height:100%;
  width:0%;
  background:var(--red);
  transition:0.3s;
}

.menu-title{
  color:#777;
  font-size:11px;
  letter-spacing:1px;
  margin:15px 0 10px;
}

.module-button{
  width:100%;
  text-align:left;
  background:#1b1b1b;
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  margin-bottom:8px;
  cursor:pointer;
}

.module-button.active{
  border-color:var(--red);
  background:#281315;
}

.module-button small{
  display:block;
  color:#999;
  margin-top:4px;
}

/* CONTEÚDO */

.main{
  margin-left:290px;
  padding:30px;
  max-width:1400px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.top small{
  color:var(--red);
  font-weight:bold;
}

.top h1{
  margin:5px 0;
}

.counter{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px;
  color:#bbb;
}

.grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) 300px;
  gap:20px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.banner{
  padding:30px;
  background:linear-gradient(135deg,#381417,#171717);
}

.drum{
  font-size:48px;
}

.tag{
  color:#ff7780;
  font-weight:bold;
  font-size:12px;
  margin-top:12px;
}

.banner h2{
  font-size:30px;
  margin:8px 0;
}

.banner p{
  color:#bbb;
  line-height:1.6;
}

.content{
  padding:28px;
}

.section{
  margin-bottom:25px;
}

.section h3{
  margin-bottom:10px;
}

.section p,
.section li{
  color:#bbb;
  line-height:1.7;
}

.section ul{
  padding-left:22px;
}

.exercise{
  background:#211012;
  border:1px solid #51252a;
  border-radius:12px;
  padding:18px;
  margin-bottom:20px;
}

.tip{
  background:#1c1c1c;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.btn{
  border:0;
  padding:13px 18px;
  border-radius:10px;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:var(--red);
}

.secondary{
  background:#292929;
}

.side-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px;
  margin-bottom:18px;
}

.stat{
  background:#202020;
  border:1px solid var(--border);
  border-radius:10px;
  padding:15px;
  margin-top:10px;
}

.number{
  font-size:28px;
  font-weight:bold;
  color:var(--red);
}

.stat p{
  color:#999;
  margin:4px 0 0;
  font-size:13px;
}

.lesson-button{
  width:100%;
  background:#202020;
  color:white;
  border:1px solid var(--border);
  padding:11px;
  border-radius:9px;
  margin-top:7px;
  text-align:left;
  cursor:pointer;
}

.lesson-button.active{
  border-color:var(--red);
  background:#281315;
}

.lesson-button.done{
  border-color:var(--green);
}

.lesson-button small{
  display:block;
  color:#999;
  margin-top:3px;
}

@media(max-width:950px){

  .sidebar{
    position:relative;
    width:100%;
    height:auto;
  }

  .main{
    margin-left:0;
    padding:18px;
  }

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .top{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

  .banner,
  .content{
    padding:20px;
  }

}
</style>
</head>

<body>

<aside class="sidebar">

<div class="logo">
Bateria<span>Pro</span>
</div>

<div class="course-box">
<strong>🥁 Área do Aluno</strong>
<p>Curso completo com 50 aulas escritas de bateria.</p>
</div>

<div class="progress-text">
<span>Seu progresso</span>
<strong id="progressPercent">0%</strong>
</div>

<div class="progress">
<div id="progressFill"></div>
</div>

<div class="menu-title">
MÓDULOS DO CURSO
</div>

<div id="moduleList"></div>

</aside>


<main class="main">

<div class="top">

<div>
<small>ÁREA DE ESTUDOS</small>
<h1 id="moduleTitle"></h1>
</div>

<div class="counter" id="counter"></div>

</div>


<div class="grid">

<section class="card">

<div class="banner">

<div class="drum">🥁</div>

<div class="tag" id="lessonTag"></div>

<h2 id="lessonTitle"></h2>

<p id="lessonSummary"></p>

</div>


<div class="content">

<div class="section">

<h3>📖 Conteúdo da Aula</h3>

<p id="lessonContent"></p>

</div>


<div class="section">

<h3>🎯 Pontos importantes</h3>

<ul id="lessonPoints"></ul>

</div>


<div class="exercise">

<h3>🥁 Exercício prático</h3>

<p id="lessonExercise"></p>

</div>


<div class="tip">

<h3>💡 Dica</h3>

<p id="lessonTip"></p>

</div>


<div class="actions">

<button class="btn primary" onclick="completeLesson()">
✓ Concluir Aula
</button>

<button class="btn secondary" onclick="previousLesson()">
← Anterior
</button>

<button class="btn secondary" onclick="nextLesson()">
Próxima →
</button>

</div>

</div>

</section>


<aside>

<div class="side-card">

<h3>🏆 Progresso</h3>

<div class="stat">

<div class="number" id="completedNumber">0</div>

<p>Aulas concluídas</p>

</div>

<div class="stat">

<div class="number" id="remainingNumber">50</div>

<p>Aulas restantes</p>

</div>

</div>


<div class="side-card">

<h3 id="lessonListTitle">
📚 Aulas
</h3>

<div id="lessonList"></div>

</div>

</aside>

</div>

</main>


<script>

/* =========================================================
   BATARIAPRO - CURSO COMPLETO
   50 AULAS
========================================================= */

const course = [

{
name:"Conhecendo a Bateria",

lessons:[

["Bem-vindo ao BateriaPro",
"Conheça o funcionamento do curso e como organizar seus estudos."],

["Conhecendo a bateria",
"Aprenda quais são as principais partes da bateria."],

["Pratos e tambores",
"Entenda a diferença entre os elementos do instrumento."],

["Tipos de baquetas",
"Conheça diferentes modelos de baquetas."],

["Postura",
"Aprenda uma posição confortável para tocar."],

["Como segurar as baquetas",
"Desenvolva controle básico das mãos."]

]
},

{
name:"Primeiros Ritmos",

lessons:[

["Pulso e tempo","Entenda a base da organização musical."],

["Usando o metrônomo","Pratique com uma referência de tempo."],

["Contagem musical","Organize os tempos de um ritmo."],

["Seu primeiro ritmo","Monte uma sequência simples."],

["Variação básica","Faça pequenas mudanças no ritmo."],

["Exercício completo","Revise os conceitos do módulo."]

]
},

{
name:"Coordenação",

lessons:[

["Coordenação das mãos","Desenvolva movimentos alternados."],

["Introdução ao bumbo","Aprenda a utilizar o pedal."],

["Mãos e pé juntos","Combine diferentes movimentos."],

["Independência","Desenvolva controle entre os membros."],

["Exercício de coordenação","Combine os fundamentos estudados."]

]
},

{
name:"Ritmos Populares",

lessons:[

["Ritmo de Rock","Conheça características básicas do rock."],

["Variações de Rock","Crie novas versões de uma base."],

["Ritmo Pop","Aprenda princípios de acompanhamento."],

["Introdução ao Samba","Conheça fundamentos rítmicos do samba."],

["Ritmo Funk","Trabalhe groove e precisão."],

["Ritmo Reggae","Observe a importância dos espaços."]

]
},

{
name:"Técnica",

lessons:[

["Rudimentos","Conheça exercícios fundamentais."],

["Single Stroke","Pratique golpes alternados."],

["Double Stroke","Pratique dois golpes por mão."],

["Dinâmica","Controle a intensidade dos sons."],

["Velocidade","Aumente gradualmente."],

["Metrônomo avançado","Avalie sua precisão."]

]
},

{
name:"Performance",

lessons:[

["Tocando com música","Aprenda a acompanhar uma canção."],

["Preparando uma apresentação","Organize sua prática."],

["Mantendo o tempo","Busque estabilidade."],

["Erros comuns","Identifique problemas."],

["Plano de evolução","Organize seus estudos."],

["Próximos passos","Continue sua evolução."]

]
},

/* ==========================
MÓDULO 7
========================== */

{
name:"Leitura Rítmica",

lessons:[

["Figuras musicais",
"Conheça os símbolos utilizados para representar durações musicais."],

["Semínimas",
"Entenda como funciona uma das figuras rítmicas mais utilizadas."],

["Colcheias",
"Aprenda a dividir o pulso em partes menores."],

["Pausas musicais",
"Conheça a importância dos silêncios dentro da música."],

["Leitura de ritmos simples",
"Combine os conhecimentos anteriores para interpretar ritmos básicos."]

]
},

/* ==========================
MÓDULO 8
========================== */

{
name:"Viradas",

lessons:[

["Introdução às viradas",
"Entenda o objetivo das viradas na bateria."],

["Viradas simples",
"Crie pequenas transições utilizando movimentos básicos."],

["Viradas com tons",
"Utilize diferentes tambores para criar novas sonoridades."],

["Viradas no tempo",
"Aprenda a encaixar uma virada sem perder o pulso."],

["Criando suas próprias viradas",
"Use criatividade para montar suas próprias ideias rítmicas."]

]
},

/* ==========================
MÓDULO 9
========================== */

{
name:"Evolução e Projeto Final",

lessons:[

["Como criar uma rotina de estudos",
"Organize seu tempo para estudar de forma consistente."],

["Como praticar corretamente",
"Aprenda a estudar com atenção e objetivos claros."],

["Como tocar músicas completas",
"Aprenda a acompanhar uma música do começo ao fim."],

["Como desenvolver criatividade",
"Crie novas ideias e explore diferentes possibilidades."],

["Projeto final BateriaPro",
"Utilize tudo o que aprendeu durante o curso."]

]
}

];


/* ESTADO */

let currentModule = 0;
let currentLesson = 0;

let completed = [];

try{

completed = JSON.parse(
localStorage.getItem("bateriapro_progress")
|| "[]"
);

}catch(error){

completed = [];

}


/* GERAR DADOS DA AULA */

function getLessonData(title,summary){

return {

title:title,

summary:summary,

content:
"Esta aula foi criada para ajudar você a desenvolver seus conhecimentos em bateria de forma gradual. Leia o conteúdo, compreenda os fundamentos e pratique com calma. O objetivo é melhorar sua técnica, coordenação, percepção rítmica e confiança durante a execução.",

points:[

"Pratique devagar no início",

"Mantenha o pulso constante",

"Evite criar tensão desnecessária",

"Repita o exercício regularmente"

],

exercise:
"Reserve alguns minutos para praticar o conteúdo desta aula. Comece lentamente e repita o exercício até sentir segurança.",

tip:
"Não tente aumentar a velocidade rapidamente. Primeiro desenvolva controle e precisão."

};

}


/* TOTAL */

function getTotalLessons(){

let total = 0;

course.forEach(module=>{

total += module.lessons.length;

});

return total;

}


function getLessonId(module,lesson){

return module + "-" + lesson;

}


/* MÓDULOS */

function renderModules(){

const container =
document.getElementById("moduleList");

container.innerHTML = "";

course.forEach((module,index)=>{

const button =
document.createElement("button");

button.className =
"module-button " +
(index === currentModule ? "active" : "");

button.innerHTML = `

<strong>
📘 Módulo ${String(index+1).padStart(2,"0")}
</strong>

<small>
${module.name}
</small>

`;

button.onclick = function(){

currentModule = index;

currentLesson = 0;

render();

};

container.appendChild(button);

});

}


/* AULAS */

function renderLessons(){

const container =
document.getElementById("lessonList");

container.innerHTML = "";

const lessons =
course[currentModule].lessons;

lessons.forEach((lesson,index)=>{

const lessonID =
getLessonId(
currentModule,
index
);

const isDone =
completed.includes(lessonID);

const button =
document.createElement("button");

button.className =
"lesson-button " +
(index === currentLesson ? "active " : "") +
(isDone ? "done" : "");

button.innerHTML = `

${isDone ? "✅" : "📖"}

<strong>
${String(index+1).padStart(2,"0")}.
${lesson[0]}
</strong>

<small>
${isDone ? "Concluída" : "Aula escrita"}
</small>

`;

button.onclick = function(){

currentLesson = index;

render();

window.scrollTo({

top:0,
behavior:"smooth"

});

};

container.appendChild(button);

});

}


/* CARREGAR AULA */

function loadLesson(){

const lesson =
course[currentModule]
.lessons[currentLesson];

const data =
getLessonData(
lesson[0],
lesson[1]
);

document
.getElementById("lessonTag")
.textContent =

"MÓDULO " +
String(currentModule+1).padStart(2,"0") +
" • AULA " +
String(currentLesson+1).padStart(2,"0");


document
.getElementById("lessonTitle")
.textContent =
data.title;


document
.getElementById("lessonSummary")
.textContent =
data.summary;


document
.getElementById("lessonContent")
.textContent =
data.content;


document
.getElementById("lessonExercise")
.textContent =
data.exercise;


document
.getElementById("lessonTip")
.textContent =
data.tip;


const points =
document.getElementById("lessonPoints");

points.innerHTML = "";

data.points.forEach(point=>{

const item =
document.createElement("li");

item.textContent = point;

points.appendChild(item);

});

}


/* PROGRESSO */

function updateProgress(){

const total =
getTotalLessons();

const done =
completed.length;

const percent =
Math.round(
(done / total) * 100
);


document
.getElementById("progressPercent")
.textContent =
percent + "%";


document
.getElementById("progressFill")
.style.width =
percent + "%";


document
.getElementById("counter")
.textContent =
done +
" de " +
total +
" aulas concluídas";


document
.getElementById("completedNumber")
.textContent =
done;


document
.getElementById("remainingNumber")
.textContent =
total - done;

}


/* CONCLUIR */

function completeLesson(){

const id =
getLessonId(
currentModule,
currentLesson
);


if(!completed.includes(id)){

completed.push(id);

localStorage.setItem(

"bateriapro_progress",

JSON.stringify(completed)

);

}

render();

}


/* PRÓXIMA */

function nextLesson(){

const lessons =
course[currentModule].lessons;


if(
currentLesson <
lessons.length - 1
){

currentLesson++;

}

else if(
currentModule <
course.length - 1
){

currentModule++;

currentLesson = 0;

}


render();


window.scrollTo({

top:0,
behavior:"smooth"

});

}


/* ANTERIOR */

function previousLesson(){

if(currentLesson > 0){

currentLesson--;

}

else if(currentModule > 0){

currentModule--;

currentLesson =
course[currentModule]
.lessons.length - 1;

}


render();


window.scrollTo({

top:0,
behavior:"smooth"

});

}


/* RENDER */

function render(){

document
.getElementById("moduleTitle")
.textContent =

"Módulo " +
String(currentModule+1).padStart(2,"0") +
" — " +
course[currentModule].name;


document
.getElementById("lessonListTitle")
.textContent =

"📚 " +
course[currentModule].name;


renderModules();

renderLessons();

loadLesson();

updateProgress();

}


/* INICIAR */

render();

</script>

</body>
</html>
