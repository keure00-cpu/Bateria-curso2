<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BateriaPro | Área do Aluno</title>

<style>
:root{
  --red:#e63946;
  --dark:#080808;
  --sidebar:#101010;
  --card:#151515;
  --card2:#1d1d1d;
  --border:#303030;
  --text:#fff;
  --muted:#a0a0a0;
  --green:#22c55e;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{scroll-behavior:smooth}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--dark);
  color:var(--text);
}

button{
  font-family:inherit;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:300px;
  height:100vh;
  overflow-y:auto;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  padding:22px;
}

.logo{
  font-size:30px;
  font-weight:900;
  margin-bottom:25px;
}

.logo span{color:var(--red)}

.course-box{
  padding:17px;
  border-radius:15px;
  background:linear-gradient(135deg,#251214,#151515);
  border:1px solid #51252a;
  margin-bottom:20px;
}

.course-box p{
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
}
