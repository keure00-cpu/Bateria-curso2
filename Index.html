<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BateriaPro | Área do Aluno</title>

  <style>
    :root{
      --red:#e63946;
      --dark:#080808;
      --side:#101010;
      --card:#171717;
      --border:#303030;
      --text:#ffffff;
      --muted:#aaaaaa;
      --green:#22c55e;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--dark);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    button{
      font-family:inherit;
    }

    /* MENU */

    .sidebar{
      position:fixed;
      left:0;
      top:0;
      width:290px;
      height:100vh;
      overflow-y:auto;
      background:var(--side);
      border-right:1px solid var(--border);
      padding:20px;
    }

    .logo{
      font-size:30px;
      font-weight:900;
      margin-bottom:20px;
    }
